<svg viewBox="0 0 600 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="beige" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F5F1E8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E8E0D0;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="url(#beige)"/>
  
  <!-- Left side - Text content -->
  <text x="30" y="50" font-size="22" font-weight="bold" fill="#000">FitAI - Calorie</text>
  <text x="30" y="75" font-size="22" font-weight="bold" fill="#FFD400">Tracker &amp;</text>
  <text x="30" y="100" font-size="22" font-weight="bold" fill="#FFD400">Nutrition</text>
  <text x="30" y="125" font-size="22" font-weight="bold" fill="#000">Assistant</text>
  
  <!-- Description -->
  <text x="30" y="155" font-size="10" fill="#333" font-weight="600">An intelligent calorie tracking platform</text>
  <text x="30" y="168" font-size="10" fill="#333">that helps users monitor nutrition, set</text>
  <text x="30" y="181" font-size="10" fill="#333">fitness goals and build a healthy lifestyle</text>
  <text x="30" y="194" font-size="10" fill="#333">with AI insights.</text>
  
  <!-- Features list -->
  <circle cx="42" cy="218" r="16" fill="#FFD400" opacity="0.3"/>
  <text x="42" y="224" font-size="14" text-anchor="middle" fill="#FFD400">🔥</text>
  <text x="70" y="218" font-size="9" font-weight="bold" fill="#000">Calorie Tracking</text>
  <text x="70" y="230" font-size="8" fill="#666">Track daily intake and</text>
  <text x="70" y="240" font-size="8" fill="#666">burned calories</text>
  
  <circle cx="42" cy="268" r="16" fill="#FFD400" opacity="0.3"/>
  <text x="42" y="274" font-size="14" text-anchor="middle" fill="#FFD400">🤖</text>
  <text x="70" y="268" font-size="9" font-weight="bold" fill="#000">AI Nutrition Assistant</text>
  <text x="70" y="280" font-size="8" fill="#666">Personalized food and</text>
  <text x="70" y="290" font-size="8" fill="#666">health recommendations</text>
  
  <circle cx="42" cy="318" r="16" fill="#FFD400" opacity="0.3"/>
  <text x="42" y="324" font-size="14" text-anchor="middle" fill="#FFD400">📊</text>
  <text x="70" y="318" font-size="9" font-weight="bold" fill="#000">Meal Analysis</text>
  <text x="70" y="330" font-size="8" fill="#666">Detailed macro &amp;</text>
  <text x="70" y="340" font-size="8" fill="#666">micronutrient breakdown</text>
  
  <!-- Center - Progress circle -->
  <circle cx="320" cy="160" r="55" fill="none" stroke="#FFD400" stroke-width="2" opacity="0.2"/>
  <circle cx="320" cy="160" r="55" fill="none" stroke="#FFD400" stroke-width="10" stroke-dasharray="259.2 345.6" transform="rotate(-90 320 160)"/>
  <text x="320" y="168" font-size="18" font-weight="bold" fill="#FFD400" text-anchor="middle">1,870</text>
  <text x="320" y="188" font-size="10" fill="#333" text-anchor="middle">/ 2,400 kcal</text>
  
  <!-- Stats boxes -->
  <rect x="270" y="245" width="100" height="65" fill="#FFD400" opacity="0.1" rx="8"/>
  <text x="320" y="263" font-size="14" font-weight="bold" fill="#FFD400" text-anchor="middle">🔥 620</text>
  <text x="320" y="280" font-size="9" fill="#333" text-anchor="middle">Burned</text>
  
  <rect x="390" y="245" width="100" height="65" fill="#FFD400" opacity="0.1" rx="8"/>
  <text x="440" y="263" font-size="14" font-weight="bold" fill="#333" text-anchor="middle">⏱️ 310</text>
  <text x="440" y="280" font-size="9" fill="#333" text-anchor="middle">Remaining</text>
  
  <!-- Bottom stats -->
  <text x="40" y="360" font-size="11" font-weight="bold" fill="#000">🔥 1,870 kcal</text>
  <text x="40" y="375" font-size="9" fill="#666">Consumed</text>
  
  <text x="160" y="360" font-size="11" font-weight="bold" fill="#000">🔥 620 kcal</text>
  <text x="160" y="375" font-size="9" fill="#666">Burned</text>
  
  <text x="280" y="360" font-size="11" font-weight="bold" fill="#000">🎯 85%</text>
  <text x="280" y="375" font-size="9" fill="#666">Goal Progress</text>
  
  <text x="380" y="360" font-size="11" font-weight="bold" fill="#000">📈 +24%</text>
  <text x="380" y="375" font-size="9" fill="#666">Better than last week</text>
</svg>
